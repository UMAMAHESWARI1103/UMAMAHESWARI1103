<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="198" viewBox="0 0 1000 198" font-family="'JetBrains Mono','Fira Code','Courier New',monospace">
<style>
.pulse{animation:p 1.8s ease-in-out infinite}
.pulse2{animation:p 1.8s ease-in-out .6s infinite}
.blink{animation:b 1s steps(2,start) infinite}
.scan{animation:s 5s linear infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes b{to{visibility:hidden}}
@keyframes s{0%{transform:translateY(-20px)}100%{transform:translateY(198px)}}
</style>
<rect width="1000" height="198" fill="#070d1c"/>
